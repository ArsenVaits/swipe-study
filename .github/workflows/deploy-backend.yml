name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrolled-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Validate deployment tooling
        run: |
          bash -n scripts/deploy/*.sh
          shellcheck scripts/deploy/*.sh
          python3 -m unittest discover -s scripts/deploy/tests -v
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Backend lint when configured
        working-directory: backend
        run: npm run lint --if-present
      - name: Backend TypeScript
        working-directory: backend
        run: npm run typecheck
      - name: Backend API and persistence tests
        working-directory: backend
        run: npm test
      # The existing service runs TypeScript natively. No compilation is needed.
      - name: Deploy validated backend commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy/ssh-deploy.sh backend
      - name: Deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
          REVISION: ${{ github.sha }}
        run: |
          echo "Backend deployment: $RESULT ($REVISION)"
          echo "Backend deployment: **$RESULT** for \`$REVISION\`." >> "$GITHUB_STEP_SUMMARY"
